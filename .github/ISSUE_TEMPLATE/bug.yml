name: Bug report
description: Report a defect in kamayoq.
labels: ["bug", "needs-human"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not report a vulnerability here. Follow the
        [security policy](https://github.com/jtdub/kamayoq/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of uv run kamayoq --version, or the commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
    validations:
      required: false
