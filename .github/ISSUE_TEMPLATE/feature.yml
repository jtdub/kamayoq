name: Feature request
description: Suggest a change to kamayoq.
labels: ["type:feature", "needs-human"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "One sentence: what do you want?"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who has the problem, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know that the change works? Write one item for each criterion.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
    validations:
      required: false
