[project]
name = "kamayoq"
version = "0.1.0.dev0"
description = "Control plane for agentic operations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The kamayoq Authors" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kamayoq = "kamayoq.cli:main"

[dependency-groups]
dev = [
    "docker>=7.2",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9",
    "pytest-cov>=7.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17",
    "testcontainers>=4.15",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.33,<0.12"
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
extend-exclude = [".sdlc-crew"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D", "ERA", "PGH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
addopts = ["--cov", "-rfEs"]
strict_markers = true
markers = [
    "unit: a test that needs no service outside the process",
    "integration: a test that needs Docker and a Postgres container",
]

[tool.coverage.run]
source_pkgs = ["kamayoq"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_untyped_imports = true
