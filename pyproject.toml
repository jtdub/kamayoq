[project]
name = "kamayoq"
version = "0.1.0.dev0"
description = "Control plane for agentic operations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The kamayoq Authors" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
kamayoq = "kamayoq.cli:main"

[dependency-groups]
audit = ["pip-audit>=2.10.1"]
changelog = ["towncrier>=26.9.0"]
dev = [
    { include-group = "changelog" },
    "docker>=7.2",
    "httpx2>=2.16",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9",
    "pytest-cov>=7.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17",
    "testcontainers>=4.15",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.33,<0.12"
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
extend-exclude = [".sdlc-crew"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "D", "ERA", "PGH", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
addopts = ["--cov", "-rfEs"]
strict_markers = true
markers = [
    "unit: a test that needs no service outside the process",
    "integration: a test that needs Docker and a Postgres container",
]

[tool.coverage.run]
source_pkgs = ["kamayoq"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
follow_untyped_imports = true

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
template = "changes/template.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/jtdub/kamayoq/issues/{issue})"
ignore = []

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
